[tool.poetry]
name = "fca-math"
version = "1.0.1"
description = "Formal Concept Analysis math Python companion"
authors = ["Bernhard Ganter"]
license = "temporarily non-free"
readme = "README.md"
packages = [{include = "fca_math", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = "^1.24"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
